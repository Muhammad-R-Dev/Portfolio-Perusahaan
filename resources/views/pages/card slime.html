<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>CSS inverted border-radius</title>
    <style>
      @import url('https://fonts.cdnfonts.com/css/neue-haas-grotesk-display-pro');

      :root {
        --blue: #172142;
        --backgroundImage: url(https://images.pexels.com/photos/24243998/pexels-photo-24243998/free-photo-of-close-up-of-jellyfish.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1);
        --pseudoHeight: 50px;
        --borderRadius-100: 50px;
        --borderRadius-200: 30px;
        --fontFamily: 'Neue Haas Grotesk Display Pro', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        color: #ffffff;
        font-family: var(--fontFamily);
      }

      *::after, *::before {
        content: '';
        position: absolute;
        left: 0;
        height: var(--pseudoHeight);
      }

      body {
        height: 100vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .wrapper {
        position: relative;
        width: 250px;
        aspect-ratio: 1 / 2;
        display: flex;
        align-items: flex-end;
        background: var(--backgroundImage);
        background-position: center;
        background-size: 100% 100%;
        border-radius: var(--borderRadius-200);
        overflow: hidden;

        .container {
          position: relative;
          height: 50%;
          width: 100%;
          background: var(--blue);
          border-top-right-radius: var(--borderRadius-100);
          display: flex;
          flex-direction: column;
          padding-left: 1.5rem;
          z-index: 1;

          &::after {
            top: calc(-1 * var(--pseudoHeight));
            aspect-ratio: 1;
            background: transparent;
            border-bottom-left-radius: var(--borderRadius-100);
            box-shadow: -20px 20px 0px 20px var(--blue);
            z-index: -1;
          }

          h2 {
            font-size: 27px;
            letter-spacing: 1px;
            margin-block: 3rem 1.2rem;
          }

          p {
            &:nth-of-type(2) {
              margin-top: 0.3rem;
            }

            span {
              color: rgb(255, 255, 255, 0.6);
              font-style: italic;
            }
          }
        }
      }
    </style>
  </head>
    
  <body>
    <div class="wrapper">        
      <div class="container">
          <h2>Jelly Fish</h2>
          <p><span>Latin:</span> Scyphozoa</p>
          <p><span>Kingdom:</span> phylum Cnidaria</p>
      </div>
    </div>
  </body>
  
</html>
