<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Smooth Curved Card</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: grid;
      place-items: center;
      --card-border-radius: 20px;
    }

    .card {
      width: 300px;
      height: 400px;
      background-color: #fff;
      background-image: url("https://fastly.picsum.photos/id/27/300/240.jpg?hmac=X9A5Yu7d1RCtQc3L43pT_-EFCDxFHOSfeTTyOa1BFXA");
      background-repeat: no-repeat;
      border-radius: var(--card-border-radius);
      overflow: hidden;
      position: relative;
    }

    .card-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      border-radius: 0 0 0 var(--card-border-radius);
      background-image: url("https://fastly.picsum.photos/id/27/300/240.jpg?hmac=X9A5Yu7d1RCtQc3L43pT_-EFCDxFHOSfeTTyOa1BFXA");
      z-index: 2;
    }

    .card-content {
      position: absolute;
      bottom: 0;
      left: 0;
      background: #fff;
      width: 100%;
      height: 50%;
      border-radius: 0 var(--card-border-radius) 0 0;
      z-index: 2;
    }

    .background-hider {
      position: absolute;
      width: var(--card-border-radius);
      height: 100%;
      background: #fff;
      left: 0;
      top: 0;
      z-index: 1;
    }

    .card-text-content {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      padding: 10px 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="card-photo"></div>
    <div class="card-content">
      <div class="card-text-content">
        <h1>Lorem Ipsum</h1>
        <p>Lorem ipsum dolor sit amet. Non voluptas minus et velit pariatur et aliquam neque et doloribus illum. </p>
      </div>
    </div>
    <div class="background-hider"></div>
  </div>
</body>

</html>
