<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Coverflow</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background-color: #ece8e0;
        font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-content: center;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-content: center;
        padding: 16px;
      }

      .mono {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }

      .gallery {
        color: #2b2722;
        user-select: none;
        width: min(94vw, 620px);
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .stage {
        position: relative;
        height: clamp(220px, 42vw, 300px);
        perspective: 1000px;
        cursor: grab;
        touch-action: pan-y;
      }

      .stage:active {
        cursor: grabbing;
      }

      .slide {
        margin: 0;
        position: absolute;
        top: 0;
        left: 50%;
        width: var(--card-width, 168px);
        margin-left: calc(var(--card-width, 168px) / -2);
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .slide-frame {
        aspect-ratio: 3 / 4;
        border-radius: 4px;
        overflow: hidden;
        border: 2px solid rgba(43, 39, 34, 0.08);
        box-shadow: 0 8px 16px -10px rgba(43, 39, 34, 0.25);
        background: #d8d3c8;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .slide.is-current .slide-frame {
        border-color: #2b2722;
        box-shadow: 0 18px 30px -12px rgba(43, 39, 34, 0.4);
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: grayscale(45%) brightness(0.9);
        transition: filter 0.4s ease;
      }

      .slide.is-current img {
        filter: none;
      }

      .slide figcaption {
        margin-top: 10px;
        font-size: clamp(11px, 3vw, 13px);
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .slide.is-current figcaption {
        opacity: 1;
        transform: translateY(0);
      }

      .slide figcaption .title {
        font-weight: 600;
      }

      .slide figcaption .place {
        font-size: clamp(9px, 2.6vw, 11px);
        color: #9a9184;
      }

      .controls {
        margin-top: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }

      .nav-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(43, 39, 34, 0.15);
        background: #fff;
        color: #2b2722;
        cursor: pointer;
        opacity: 1;
        transition: border-color 0.2s ease, transform 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-btn:hover:not(:disabled) {
        border-color: #2b2722;
      }

      .nav-btn:active:not(:disabled) {
        transform: scale(0.92);
      }

      .nav-btn:disabled {
        cursor: default;
        opacity: 0.25;
      }

      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 45vw;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .dots::-webkit-scrollbar {
        display: none;
      }

      .dot-btn {
        border: none;
        padding: 6px 2px;
        cursor: pointer;
        background: transparent;
        flex-shrink: 0;
      }

      .dot {
        display: block;
        height: 6px;
        width: 6px;
        border-radius: 999px;
        background: rgba(43, 39, 34, 0.28);
        transition: width 0.3s ease, background 0.3s ease;
      }

      .dot-btn.is-active .dot {
        width: 20px;
        background: #2b2722;
      }

      /* ---------- Responsive breakpoints ---------- */
      @media (max-width: 600px) {
        .controls {
          gap: 0.9rem;
        }

        .dots {
          max-width: 40vw;
        }
      }

      @media (max-width: 380px) {
        .nav-btn svg {
          width: 16px;
          height: 16px;
        }

        .controls {
          gap: 0.4rem;
        }
      }

      @media (max-height: 560px) {
        .stage {
          height: clamp(160px, 34vh, 260px);
        }

        .controls {
          margin-top: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="gallery">
        <p class="sr-only" id="live-region" aria-live="polite"></p>

        <div class="stage" id="stage" role="region" aria-roledescription="carousel" aria-label="Travel photo gallery"></div>

        <div class="controls">
          <button class="nav-btn" id="prev-btn" aria-label="Previous photo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <div class="dots" id="dots" role="tablist" aria-label="Choose photo"></div>

          <button class="nav-btn" id="next-btn" aria-label="Next photo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script>
      const photos = [
        {
          src: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=500&auto=format&fit=crop",
          title: "Shibuya crossing",
          place: "Tokyo",
          no: "01"
        },
        {
          src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=500&auto=format&fit=crop",
          title: "Torii at dusk",
          place: "Kyoto",
          no: "02"
        },
        {
          src: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=500&auto=format&fit=crop",
          title: "Mount Fuji, clear morning",
          place: "Yamanashi",
          no: "03"
        },
        {
          src: "https://images.unsplash.com/photo-1528360983277-13d401cdc186?q=80&w=500&auto=format&fit=crop",
          title: "Shinkansen platform",
          place: "Tokyo",
          no: "04"
        },
        {
          src: "https://images.unsplash.com/photo-1480796927426-f609979314bd?q=80&w=500&auto=format&fit=crop",
          title: "Bamboo grove path",
          place: "Arashiyama",
          no: "05"
        },
        {
          src: "https://images.unsplash.com/photo-1542640244-7e672d6cef4e?q=80&w=500&auto=format&fit=crop",
          title: "Backstreet lanterns",
          place: "Osaka",
          no: "06"
        },
        {
          src: "https://images.unsplash.com/photo-1492571350019-22de08371fd3?q=80&w=500&auto=format&fit=crop",
          title: "Snow monkeys, onsen",
          place: "Nagano",
          no: "07"
        },
        {
          src: "https://images.unsplash.com/photo-1524413840807-0c3cb6fa808d?q=80&w=500&auto=format&fit=crop",
          title: "Pagoda, autumn light",
          place: "Kyoto",
          no: "08"
        },
        {
          src: "https://images.unsplash.com/photo-1528164344705-47542687000d?q=80&w=500&auto=format&fit=crop",
          title: "Deer park, evening",
          place: "Nara",
          no: "09"
        },
        {
          src: "https://images.unsplash.com/photo-1532236204992-f5e85c024202?q=80&w=500&auto=format&fit=crop",
          title: "Mountain ropeway",
          place: "Hakone",
          no: "10"
        }
      ];

      const stage = document.getElementById("stage");
      const dotsContainer = document.getElementById("dots");
      const liveRegion = document.getElementById("live-region");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");

      let current = 2;
      const drag = { startX: 0, dragging: false };

      // Responsive card width: scales down on small screens
      function getCardWidth() {
        const w = window.innerWidth;
        if (w <= 380) return 118;
        if (w <= 600) return 140;
        return 168;
      }

      function updateCardWidthVar() {
        document.documentElement.style.setProperty(
          "--card-width",
          `${getCardWidth()}px`
        );
      }

      function clampIndex(i) {
        return Math.min(photos.length - 1, Math.max(0, i));
      }

      function buildSlides() {
        photos.forEach((photo, i) => {
          const slide = document.createElement("figure");
          slide.className = "slide";
          slide.dataset.index = i;
          slide.setAttribute("role", "group");
          slide.setAttribute("aria-roledescription", "slide");
          slide.setAttribute(
            "aria-label",
            `${i + 1} of ${photos.length}: ${photo.title}, ${photo.place}`
          );
          slide.tabIndex = -1;

          const frame = document.createElement("div");
          frame.className = "slide-frame";

          const img = document.createElement("img");
          img.src = photo.src;
          img.alt = photo.title;
          img.draggable = false;
          img.loading = "lazy";

          frame.appendChild(img);

          const caption = document.createElement("figcaption");
          caption.innerHTML = `<span class="title">${photo.title}</span><br><span class="place">${photo.place}</span>`;

          slide.appendChild(frame);
          slide.appendChild(caption);

          slide.addEventListener("click", () => goTo(i));

          stage.appendChild(slide);
        });
      }

      function buildDots() {
        photos.forEach((photo, i) => {
          const btn = document.createElement("button");
          btn.className = "dot-btn";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-label", `Go to ${photo.title}`);
          btn.dataset.index = i;

          const dot = document.createElement("span");
          dot.className = "dot";
          btn.appendChild(dot);

          btn.addEventListener("click", () => goTo(i));

          dotsContainer.appendChild(btn);
        });
      }

      function render() {
        const cardWidth = getCardWidth();
        const slides = stage.querySelectorAll(".slide");
        slides.forEach((slide) => {
          const i = Number(slide.dataset.index);
          const offset = i - current;
          const isCurrent = offset === 0;
          const distance = Math.abs(offset);
          const sign = Math.sign(offset);
          const visible = distance <= 4;

          const x = sign * (cardWidth * 0.62 + Math.min(distance, 3) * (cardWidth * 0.083));
          const rotateY = sign * -42;
          const scale = isCurrent ? 1 : 1 - Math.min(distance, 3) * 0.08;

          slide.style.transform = `translateX(${x}px) rotateY(${rotateY}deg) scale(${scale})`;
          slide.style.opacity = visible ? "1" : "0";
          slide.style.zIndex = 10 - distance;
          slide.style.pointerEvents = visible ? "auto" : "none";
          slide.classList.toggle("is-current", isCurrent);
          slide.setAttribute("aria-current", isCurrent);
          slide.tabIndex = isCurrent ? 0 : -1;
        });

        dotsContainer.querySelectorAll(".dot-btn").forEach((btn) => {
          const i = Number(btn.dataset.index);
          const isCurrent = i === current;
          btn.classList.toggle("is-active", isCurrent);
          btn.setAttribute("aria-selected", isCurrent);
          if (isCurrent) {
            btn.scrollIntoView({ block: "nearest", inline: "center" });
          }
        });

        const photo = photos[current];
        liveRegion.textContent = `Frame ${current + 1} of ${photos.length}, ${
          photo.title
        }, ${photo.place}`;

        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === photos.length - 1;
      }

      function goTo(i) {
        current = clampIndex(i);
        render();
      }

      function prev() {
        goTo(current - 1);
      }

      function next() {
        goTo(current + 1);
      }

      prevBtn.addEventListener("click", prev);
      nextBtn.addEventListener("click", next);

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") prev();
        if (e.key === "ArrowRight") next();
      });

      // Pointer events cover mouse + touch (touch-action set in CSS to allow vertical scroll)
      stage.addEventListener("pointerdown", (e) => {
        drag.startX = e.clientX;
        drag.dragging = true;
      });

      stage.addEventListener("pointerup", (e) => {
        if (!drag.dragging) return;
        const delta = e.clientX - drag.startX;
        if (delta > 40) prev();
        else if (delta < -40) next();
        drag.dragging = false;
      });

      stage.addEventListener("pointercancel", () => {
        drag.dragging = false;
      });

      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          updateCardWidthVar();
          render();
        }, 100);
      });

      updateCardWidthVar();
      buildSlides();
      buildDots();
      render();
    </script>
  </body>

</html>
