<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore - South Korea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Poppins:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:"Poppins",sans-serif;overflow:hidden;display:grid;place-items:center;
    background:radial-gradient(circle at 20% 15%,#cfc2e6 0,transparent 45%),radial-gradient(circle at 85% 80%,#27385f 0,transparent 40%),linear-gradient(135deg,#b9b3d6,#8a95bd)}

  /* ====== DESKTOP: card besar, semua ukuran memakai cqw (mengikuti lebar card) ====== */
  .app{container-type:inline-size;position:relative;width:min(1400px,96vw);height:min(860px,94svh);
    border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(30,30,70,.35)}

  .hero{position:absolute;inset:0 auto 0 0;width:52.6%;background:#334}
  .hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease}
  .hero .bg.on{opacity:1}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28),transparent 30%,transparent 60%,rgba(0,0,0,.4))}

  .logo{position:absolute;left:3.9%;top:4.4%;z-index:5;color:#fff;font-weight:600;font-size:clamp(17px,1.9cqw,28px)}
  .nav{position:absolute;top:4.6%;z-index:5;display:flex;align-items:center;gap:3cqw;font-size:clamp(12px,1.05cqw,16px);font-weight:500}
  .nav a{position:relative;text-decoration:none;white-space:nowrap}
  .nav.a{left:33.5%}.nav.a a{color:#fff}
  .nav.b{left:59.6%}.nav.c{right:3.7%;gap:1.4cqw}
  .nav.b a,.nav.c a{color:#222}
  .nav .active:after{content:"";position:absolute;left:25%;right:25%;bottom:-7px;height:2px;background:#fff}
  .nav svg{display:block;width:1.4cqw;min-width:15px;height:auto}

  .controls{position:absolute;left:3.9%;bottom:4.5%;z-index:5;display:flex;align-items:center;color:#fff}
  .arrow{width:clamp(44px,4.2cqw,64px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:transparent;
    color:#fff;display:grid;place-items:center;cursor:pointer;margin-right:.9cqw;padding:0;transition:background .2s}
  .arrow:hover{background:rgba(255,255,255,.2)}
  .arrow svg{width:36%;height:36%}
  .line{width:17cqw;height:1.5px;background:rgba(255,255,255,.4);margin-left:2cqw;position:relative}
  .line i{position:absolute;left:0;top:0;height:100%;background:#fff;transition:width .6s ease}
  .count{margin-left:1.5cqw;font-size:clamp(18px,1.9cqw,28px);letter-spacing:1px}

  .text{position:absolute;left:56.4%;bottom:calc(14% + 15.8cqw + 4%);width:39%;z-index:8;transition:opacity .35s ease,transform .35s ease}
  .text.out{opacity:0;transform:translateY(12px)}
  .script{font-family:"Caveat",cursive;font-size:clamp(24px,2.9cqw,44px);color:#222;line-height:1;margin:0}
  h1{margin:.3cqw 0 1.1cqw;font-size:clamp(30px,min(4.9cqw,7svh),72px);font-weight:600;color:#111;letter-spacing:-.5px;line-height:1.12}
  .text p.d{margin:0;font-size:clamp(12px,min(1.2cqw,1.9svh),18px);line-height:1.7;color:#666}

  .thumbs{--gap:2.2cqw;position:absolute;left:56.4%;width:39.9%;bottom:14%;overflow:hidden;z-index:6;padding-bottom:16px;margin-bottom:-16px}
  .track{display:flex;gap:var(--gap);will-change:transform}
  .track.anim{transition:transform .55s cubic-bezier(.65,0,.35,1)}
  .thumb{flex:none;width:calc((100% - 2*var(--gap))/3);aspect-ratio:3/4;border-radius:16px;background-size:cover;background-position:center;
    position:relative;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden}
  .thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
  .thumb span{position:absolute;left:8%;bottom:6%;z-index:2;color:#fff;font-size:clamp(11px,1.05cqw,16px);font-weight:500;line-height:1.3;max-width:75%}

  .cta{position:absolute;right:3.7%;bottom:4.5%;display:flex;align-items:center;z-index:5;cursor:pointer;border:0;background:none;padding:0;font-family:inherit}
  .cta .dot{position:absolute;left:-1.7cqw;top:50%;transform:translateY(-50%);width:clamp(44px,4.2cqw,64px);aspect-ratio:1;border-radius:50%;background:#f7d316}
  .cta b{position:relative;font-size:clamp(11px,1.1cqw,16px);font-weight:600;color:#111}
  .cta .ln{position:relative;width:7cqw;height:1.5px;background:#111;margin-left:1.3cqw;transition:width .2s}
  .cta .ln:after{content:"";position:absolute;right:0;top:-3.5px;width:7px;height:7px;border-top:1.5px solid #111;border-right:1.5px solid #111;transform:rotate(45deg)}
  .cta:hover .ln{width:8cqw}

  /* tombol detail + popup */
  .btn-detail{margin-top:1.3cqw;border:1.5px solid #111;background:transparent;color:#111;font:600 clamp(11px,1cqw,14px) "Poppins",sans-serif;
    letter-spacing:.4px;text-transform:uppercase;padding:.6cqw 1.8cqw;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
  .btn-detail:hover{background:#111;color:#fff}
  .modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,12,30,.55);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{position:relative;width:min(520px,86%);max-height:88%;overflow:auto;background:#fff;border-radius:20px;transform:translateY(20px);transition:transform .3s}
  .modal.open .sheet{transform:none}
  .sheet .pic{height:210px;background-size:cover;background-position:center}
  .sheet .body{padding:20px 24px 26px}
  .sheet small{color:#888;font-size:13px;font-weight:500}
  .sheet h2{margin:2px 0 10px;font-size:30px;font-weight:600;color:#111}
  .sheet p{margin:0 0 18px;font-size:14.5px;line-height:1.75;color:#555}
  .sheet .go{display:inline-block;background:#f7d316;color:#111;border:0;border-radius:99px;padding:11px 24px;font:600 13px "Poppins",sans-serif;cursor:pointer}
  .sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.9);
    font-size:20px;line-height:1;cursor:pointer;color:#111}

  /* ====== MOBILE: card penuh layar, hero di atas, info di bawah ====== */
  @media (max-width:820px){
    .app{width:100vw;height:100svh;border-radius:0;box-shadow:none}
    .hero{inset:0 0 auto 0;width:100%;height:42%}
    .logo{display:none}
    .nav.a,.nav.b,.nav.c{display:none}

    .controls{left:5%;bottom:auto;top:calc(42% - 76px)}
    .arrow{width:44px;margin-right:10px}
    .line{width:24cqw;margin-left:14px}
    .count{font-size:20px;margin-left:12px}

    .text{left:5%;top:45%;bottom:auto;width:90%}
    .script{font-size:clamp(22px,6.4cqw,30px)}
    h1{font-size:clamp(30px,9.6cqw,44px);margin:2px 0 8px}
    .text p.d{font-size:clamp(12px,3.4cqw,14px);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .btn-detail{margin-top:10px;font-size:11.5px;padding:7px 20px}

    .thumbs{left:5%;right:0;width:auto;bottom:auto;margin-bottom:0;padding:4px 0;top:max(70%,calc(45% + 205px));height:clamp(110px,19%,170px)}
    .track{gap:12px;height:100%}
    .thumb{border-radius:14px;width:auto;height:100%}
    .thumb span{font-size:11.5px}

    .cta{right:auto;left:calc(5% + 24px);bottom:max(34px,calc(env(safe-area-inset-bottom) + 22px))}
    .cta .dot{left:-24px;width:44px}
    .cta b{font-size:12px}
    .cta .ln{width:50px;margin-left:14px}

    .modal{place-items:end center}
    .sheet{width:100%;max-height:82%;border-radius:22px 22px 0 0;transform:translateY(40px)}
    .sheet .body{padding-bottom:max(26px,env(safe-area-inset-bottom))}
  }
  @media (max-width:820px) and (max-height:720px){
    .hero{height:38%}.controls{top:calc(38% - 70px)}.text{top:41%}
    .script{font-size:20px}h1{font-size:28px;margin-bottom:4px}
    .text p.d{-webkit-line-clamp:2}.btn-detail{margin-top:8px}
    .thumbs{top:67%;height:18%}.cta{bottom:22px}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="hero" id="hero"></div>

  <div class="controls">
    <button class="arrow" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg></button>
    <button class="arrow" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="line"><i id="bar"></i></div>
  </div>

  <div class="text" id="text">
    <h1 id="title"></h1>
    <p class="d" id="desc"></p>
    <button class="btn-detail" id="detail">Detail</button>
  </div>

  <div class="thumbs"><div class="track" id="track"></div></div>

  <div class="modal" id="modal">
    <div class="sheet">
      <button class="x" id="close" aria-label="Close">&times;</button>
      <div class="pic" id="m-pic"></div>
      <div class="body">
        <small id="m-name"></small>
        <h2 id="m-title"></h2>
        <p id="m-desc"></p>
        <button class="go">Explore South Korea</button>
      </div>
    </div>
  </div>

  <button class="cta"><span class="dot"></span><b>EXPLORE SOUTH KOREA</b><span class="ln"></span></button>
</div>

<script>
  // Ganti nilai "image" dengan foto Korea Anda sendiri
  const data = [
    {name:'Anapji Pond', title:'South Korea', image:'https://assets.codepen.io/3685267/timed-cards-1.jpg',
     desc:'A South Korea tour package lets you witness towering mountains, mighty seas, glorious valleys, numerous islands, and flourishing biodiversity. It is as if God spared no expense in bestowing this country with an abyss of glory and splendour.'},
    {name:'Seoraksan Mountain', title:'Seoraksan', image:'https://assets.codepen.io/3685267/timed-cards-2.jpg',
     desc:'Seoraksan National Park is famed for jagged granite peaks wrapped in morning mist, ancient temples, and hiking trails that glow with colour every autumn.'},
    {name:'Seoul City', title:'Seoul City', image:'https://assets.codepen.io/3685267/timed-cards-3.jpg',
     desc:'Seoul blends glittering skyscrapers and neon-lit bridges with royal palaces and lively night markets, a capital that never really sleeps.'},
    {name:'Jusangjeolli Cliff', title:'Jusangjeolli', image:'https://assets.codepen.io/3685267/timed-cards-4.jpg',
     desc:'On Jeju Island, towering columns of volcanic rock rise from turquoise waves, shaped by lava that cooled into near-perfect hexagons.'},
    {name:'Haedong Yonggungsa', title:'Yonggungsa', image:'https://assets.codepen.io/3685267/timed-cards-5.jpg',
     desc:'Perched on the rocky coast of Busan, this seaside temple greets the sunrise with ocean views few sacred places in the world can match.'}
  ];
  const n = data.length;
  let cur = 0, busy = false;
  const $ = id => document.getElementById(id);
  const hero = $('hero'), track = $('track');

  data.forEach(d=>{ const b=document.createElement('div'); b.className='bg'; b.style.backgroundImage=`url(${d.image})`; hero.appendChild(b); });
  const bgs = hero.querySelectorAll('.bg');

  // jarak antar thumbnail diukur langsung, jadi otomatis cocok di desktop maupun mobile
  const slot = () => track.children[1].offsetLeft - track.children[0].offsetLeft;

  function renderTrack(start, offsetSlots){
    track.classList.remove('anim');
    track.innerHTML = '';
    for(let k=0;k<n;k++){
      const i=(start+k)%n, d=data[i];
      const t=document.createElement('div');
      t.className='thumb'; t.style.backgroundImage=`url(${d.image})`;
      t.innerHTML=`<span>${d.name}</span>`;
      t.onclick=()=>jump(i);
      track.appendChild(t);
    }
    track.style.transform=`translateX(${-offsetSlots*slot()}px)`;
    track.offsetWidth;
  }

  function show(i, animateText=true){
    bgs.forEach((b,k)=>b.classList.toggle('on',k===i));
    $('bar').style.width=((i+1)/n*100)+'%';
    const t=$('text');
    const set=()=>{ $('title').textContent=data[i].title; $('desc').textContent=data[i].desc; t.classList.remove('out'); };
    if(animateText){ t.classList.add('out'); setTimeout(set,300); } else set();
  }

  // Slide manual: hanya berpindah saat tombol/thumbnail diklik atau di-swipe
  function go(dir){
    if(busy) return; busy=true;
    const target=(cur+dir+n)%n;
    if(dir>0){
      track.classList.add('anim');
      track.style.transform=`translateX(${-2*slot()}px)`;
      show(target);
      setTimeout(()=>{ cur=target; renderTrack(cur,1); busy=false; },580);
    } else {
      cur=target; show(cur);
      renderTrack(cur,2);
      track.classList.add('anim');
      track.style.transform=`translateX(${-slot()}px)`;
      setTimeout(()=>{ busy=false; },580);
    }
  }
  function jump(i){
    if(busy||i===cur) return;
    cur=i; show(cur); renderTrack(cur,1);
  }

  // popup detail
  const modal=$('modal');
  $('detail').onclick=()=>{
    const d=data[cur];
    $('m-pic').style.backgroundImage=`url(${d.image})`;
    $('m-name').textContent=d.name;
    $('m-title').textContent=d.title;
    $('m-desc').textContent=d.desc;
    modal.classList.add('open');
  };
  const closeModal=()=>modal.classList.remove('open');
  $('close').onclick=closeModal;
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

  $('next').onclick=()=>go(1);
  $('prev').onclick=()=>go(-1);
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); });

  // swipe di layar sentuh
  let sx=null;
  $('app').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  $('app').addEventListener('touchend',e=>{
    if(sx===null) return;
    const dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>50) go(dx<0?1:-1);
  });

  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>renderTrack(cur,1),120); });

  renderTrack(0,1);
  show(0,false);
</script>
</body>
</html>
